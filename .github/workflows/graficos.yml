name: Gráficos do perfil

# Gera a grade de contribuições uma vez por dia
# (e também quando este arquivo ou o script mudam, ou quando rodado à mão em Actions).
on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/graficos.yml", "scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Grade de contribuições
        run: node scripts/contribuicoes.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Salvar no repositório
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/contribuicoes*.svg assets/contributions*.svg assets/cidade.svg assets/city.svg
          if git commit -m "Atualiza os gráficos do perfil"; then
            git push
          fi
