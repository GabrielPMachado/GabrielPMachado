name: Gráficos do perfil

# Gera os prédios 3D das contribuições uma vez por dia
# (e também quando este arquivo ou o script mudam, ou quando rodado à mão em Actions).
on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/graficos.yml", "scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prédios 3D das contribuições
        run: |
          pip install --quiet pillow
          python scripts/predios.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Salvar no repositório
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/predios.webp assets/buildings.webp
          if git commit -m "Atualiza os gráficos do perfil"; then
            git push
          fi
